name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - stable
          - beta
        default: stable
      release_notes:
        description: "Release notes (what changed in this release)"
        required: false
        type: string
      force_version:
        description: "Override auto-detected version (optional, e.g., 2026.1.0)"
        required: false
        type: string
      approved_sha:
        description: "Full commit SHA approved for this release (optional)"
        required: false
        type: string

env:
  NODE_VERSION: "26"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Calculate the next CalVer version automatically
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
      tag: ${{ steps.calver.outputs.tag }}
      is_beta: ${{ steps.calver.outputs.is_beta }}
    steps:
      - name: Verify default-branch dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          DEFAULT_REF="refs/heads/${DEFAULT_BRANCH}"
          test "$DISPATCH_REF" = "$DEFAULT_REF" || {
            echo "::error::releases must be dispatched from ${DEFAULT_REF}, not ${DISPATCH_REF}"
            exit 1
          }

      - name: Verify approved commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$APPROVED_SHA" && "$GITHUB_SHA" != "$APPROVED_SHA" ]]; then
            printf '::error::release commit %s is not the approved %s\n' "$GITHUB_SHA" "$APPROVED_SHA"
            exit 1
          fi

      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Need full history for tags
          path: CeraUI

      - name: Calculate CalVer version
        id: calver
        working-directory: CeraUI
        env:
          RELEASE_TYPE_INPUT: ${{ inputs.release_type }}
          FORCE_VERSION_INPUT: ${{ inputs.force_version }}
        run: |
          RELEASE_TYPE="$RELEASE_TYPE_INPUT"
          FORCE_VERSION="$FORCE_VERSION_INPUT"
          STABLE_VERSION_PATTERN='^[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$'
          STABLE_TAG_PATTERN='^v[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$'
          BETA_VERSION_PATTERN='^[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)-beta\.([1-9][0-9]*)$'
          BETA_TAG_PATTERN='^v[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)-beta\.([1-9][0-9]*)$'

          if [[ "$RELEASE_TYPE" != "stable" && "$RELEASE_TYPE" != "beta" ]]; then
            echo "::error::release_type must be stable or beta"
            exit 1
          fi

          # Get current year and month
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)  # No leading zero
          IS_BETA=$([[ "$RELEASE_TYPE" == "beta" ]] && echo "true" || echo "false")

          # Check if force_version is provided
          if [ -n "$FORCE_VERSION" ]; then
            if [[ "$RELEASE_TYPE" != "stable" ]]; then
              echo "::error::force_version is supported only for stable releases"
              exit 1
            fi
            if [[ ! "$FORCE_VERSION" =~ $STABLE_VERSION_PATTERN ]]; then
              echo "::error::force_version must use stable CalVer YYYY.M.PATCH"
              exit 1
            fi
            VERSION="$FORCE_VERSION"
          else
            # Find existing tags for this year.month
            PREFIX="v${YEAR}.${MONTH}"

            if [ "$IS_BETA" == "true" ]; then
              # For beta: find highest beta number for this month
              LATEST_BETA=$(git tag -l "${PREFIX}.*-beta.*" | sed -E "s/.*-beta\.([0-9]+)/\1/" | sort -n | tail -1)

              if [ -z "$LATEST_BETA" ]; then
                BETA_NUM=1
                echo "🧪 First beta of ${YEAR}.${MONTH}"
              else
                BETA_NUM=$((LATEST_BETA + 1))
                echo "🔄 Incrementing beta: ${LATEST_BETA} → ${BETA_NUM}"
              fi

              # Get the base patch (latest stable or 0)
              LATEST_STABLE=$(git tag -l "${PREFIX}.*" | sed -n "/-beta/!s/${PREFIX}\.//p" | sort -n | tail -1)
              PATCH=${LATEST_STABLE:-0}
              NEXT_PATCH=$((PATCH + 1))

              VERSION="${YEAR}.${MONTH}.${NEXT_PATCH}-beta.${BETA_NUM}"
            else
              # For stable: find highest patch number (excluding betas)
              LATEST_PATCH=$(git tag -l "${PREFIX}.*" | sed -n "/-beta/!s/${PREFIX}\.//p" | sort -n | tail -1)

              if [ -z "$LATEST_PATCH" ]; then
                PATCH=0
                echo "📅 First release of ${YEAR}.${MONTH}"
              else
                PATCH=$((LATEST_PATCH + 1))
                echo "🔄 Incrementing patch: ${LATEST_PATCH} → ${PATCH}"
              fi

              VERSION="${YEAR}.${MONTH}.${PATCH}"
            fi
          fi

          TAG="v${VERSION}"

          if [[ "$IS_BETA" == "true" ]]; then
            if [[ ! "$VERSION" =~ $BETA_VERSION_PATTERN || ! "$TAG" =~ $BETA_TAG_PATTERN ]]; then
              echo "::error::calculated beta version/tag is invalid"
              exit 1
            fi
          elif [[ ! "$VERSION" =~ $STABLE_VERSION_PATTERN || ! "$TAG" =~ $STABLE_TAG_PATTERN ]]; then
            echo "::error::calculated stable version/tag is invalid"
            exit 1
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::tag must equal v<version>"
            exit 1
          fi
          if [[ -n "$FORCE_VERSION" ]]; then
            echo "📌 Using forced version: $VERSION"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "is_beta=${IS_BETA}"
          } >> "$GITHUB_OUTPUT"

          echo "✅ Next version: ${VERSION}"
          echo "🏷️  Tag: ${TAG}"
          echo "🧪 Beta: ${IS_BETA}"

      - name: Ensure release target is unused
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          require_missing() {
            local endpoint="$1"
            local label="$2"
            local response
            local status

            set +e
            response="$(gh api --include "$endpoint" 2>&1)"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "::error::${label} ${TAG} already exists"
              exit 1
            fi
            if ! grep -Eq '^HTTP/[0-9.]+ 404 ' <<< "$response"; then
              echo "::error::failed to verify that ${label} ${TAG} is unused"
              printf '%s\n' "$response" >&2
              exit 1
            fi
          }

          require_missing "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" "git tag"
          require_missing "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" "GitHub release"

  prepare-release-body:
    name: Prepare and validate release body
    runs-on: ubuntu-latest
    needs: calculate-version
    permissions:
      contents: write # Required by GitHub's generate-notes preview endpoint.
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - name: Generate and validate release body
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
          TAG: ${{ needs.calculate-version.outputs.tag }}
          IS_BETA: ${{ needs.calculate-version.outputs.is_beta }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/release-body.mjs scripts/ci/release-dependencies.md release-body.md

      - name: Store validated release body
        uses: actions/upload-artifact@v7
        with:
          name: release-body
          path: release-body.md
          if-no-files-found: error

  release-package-contracts:
    name: Release/package contracts
    runs-on: ubuntu-latest
    needs: [calculate-version, prepare-release-body]
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI
          fetch-depth: 0 # This job runs the same history-dependent backend suite as Build Check.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
          no-cache: true

      - name: Restore Bun install cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      # FIRST, and that ordering is the point. Several frontend specs render a
      # full dialog SYNCHRONOUSLY against vitest's 5 s default, so they are
      # sensitive to how loaded the runner already is. Run after this job's .deb
      # builds and lint, the heaviest of them took 5480-5544 ms and timed out on
      # two consecutive release dispatches — while the same commit passed in
      # build-check, whose test-fe job runs vitest immediately after `bun install`
      # on a fresh runner. This reproduces those conditions exactly: nothing but
      # checkout, Bun and install precede it. Do not move it below the packaging
      # steps, and do not "tidy" the ruby/fpm install back above it.
      - name: Frontend unit tests (vitest)
        working-directory: CeraUI
        run: bun run --filter frontend test

      - name: Restore Ruby gems cache (fpm)
        uses: actions/cache/restore@v6
        with:
          path: /var/lib/gems
          key: ${{ runner.os }}-ruby-gems-fpm-v1
          restore-keys: |
            ${{ runner.os }}-ruby-gems-fpm-

      # Two of the contracts this job runs BUILD a .deb to inspect its payload
      # (deb-reconciler-staging, deb-sourcemap-policy), so fpm is a dependency of
      # the gate itself — not only of build-debian-package, which installs it
      # separately and runs later.
      - name: Install Ruby and FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev gcc g++
          sudo gem install --no-document fpm

      # Both the package mount fixture and the backend kernel tests need real user namespaces.
      - name: Enable unprivileged user namespaces (Ubuntu AppArmor restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run release/package contracts
        working-directory: CeraUI
        run: bun run test:release-package-contracts

      - name: Verify package version matches release
        working-directory: CeraUI
        env:
          RELEASE_VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          PACKAGE_VERSION="$(bun -p 'require("./package.json").version')"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION" || {
            echo "::error::package.json version ${PACKAGE_VERSION} does not match release ${RELEASE_VERSION}"
            exit 1
          }

      - name: Lint and typecheck
        working-directory: CeraUI
        run: bun run lint

      - name: Prepare backend test runtime directories
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /run/ceralive /var/run/bcrpt

      - name: Run service contract
        working-directory: CeraUI
        run: bun run test:service-contract

      # The live-producer contract skips unless this verified sender is exported.
      - name: Prepare pinned srtla-send runtime
        working-directory: CeraUI
        run: |
          set -euo pipefail
          package_dir="dist/ci-packages"
          package_path="$package_dir/srtla_4.2.0_amd64.deb"
          runtime_root="dist/ci-runtime"
          mkdir -p "$package_dir" "$runtime_root"

          curl --fail --location --silent --show-error \
            --output "$package_path" \
            https://github.com/CERALIVE/srtla-send-rs/releases/download/v4.2.0/srtla_4.2.0_amd64.deb
          printf '%s  %s\n' \
            ec6ed389cf80c472dd1ebf3d8fd820c3bd1517517d54fbf24420322a7affd14f \
            "$package_path" | sha256sum --check
          test "$(dpkg-deb --field "$package_path" Package)" = srtla
          test "$(dpkg-deb --field "$package_path" Version)" = 4.2.0
          test "$(dpkg-deb --field "$package_path" Architecture)" = amd64
          dpkg-deb --extract "$package_path" "$runtime_root"
          test -f "$runtime_root/usr/bin/srtla_send"

      - name: Export the live sender binary
        working-directory: CeraUI
        run: |
          set -euo pipefail
          runtime_bin="$GITHUB_WORKSPACE/CeraUI/dist/ci-runtime/usr/bin/srtla_send"
          chmod +x "$runtime_bin"
          test -x "$runtime_bin"
          echo "SRTLA_SEND_BIN=$runtime_bin" >> "$GITHUB_ENV"

      # The frontend suite already ran above on a fresh runner.
      - name: Run unit tests
        working-directory: CeraUI
        run: |
          bun run --filter @ceraui/rpc test
          bun run --filter @ceraui/i18n test
          bun run --filter backend test

      # The bundled run skips these opt-in cases; the statistical tests need CPU headroom.
      - name: netns-semantics (isolated — statistical assertions need CPU headroom)
        working-directory: CeraUI
        env:
          CERALIVE_NETNS_ISOLATED: "1"
        run: bun test apps/backend/src/tests/uplink-steering-netns.test.ts apps/backend/src/tests/uplink-shaper-netns.test.ts apps/backend/src/tests/update-transport-netns.test.ts

      # The UID-routing fixture needs a nonzero UID in a private rootful network namespace.
      - name: update UID routing (rootful netns)
        working-directory: CeraUI
        run: sudo -n unshare -n env CERALIVE_NETNS_ISOLATED=1 "$(command -v bun)" test apps/backend/src/tests/update-transport-pin-netns.test.ts

  build-ceraui-system:
    name: Build CeraUI Full System
    runs-on: ubuntu-latest
    needs: [calculate-version, release-package-contracts, build-debian-package]
    if: success()
    strategy:
      matrix:
        architecture: [arm64, amd64]
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Build CeraUI system distribution for ${{ matrix.architecture }}
        working-directory: CeraUI
        run: ./scripts/build/build-ceraui-system.sh
        env:
          BUILD_VERSION: ${{ needs.calculate-version.outputs.version }}
          BUILD_ARCH: ${{ matrix.architecture }}

      - name: Rename archive for release
        working-directory: CeraUI
        env:
          RELEASE_VERSION: ${{ needs.calculate-version.outputs.version }}
          RELEASE_ARCH: ${{ matrix.architecture }}
        run: |
          cd dist/compressed
          # Find the generated archive and rename to clean version
          for f in *.tar.gz; do
            mv "$f" "ceraui-${RELEASE_VERSION}-${RELEASE_ARCH}.tar.gz"
          done

      - name: Upload compressed distribution (${{ matrix.architecture }})
        uses: actions/upload-artifact@v7
        with:
          name: ceraui-system-${{ matrix.architecture }}
          path: CeraUI/dist/compressed/*.tar.gz

  build-debian-package:
    name: Build and Verify Debian Packages
    runs-on: ubuntu-latest
    needs: [calculate-version, release-package-contracts]
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
          no-cache: true

      - name: Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Restore Ruby gems cache (fpm)
        id: fpm-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/lib/gems
          key: ${{ runner.os }}-ruby-gems-fpm-v1
          restore-keys: |
            ${{ runner.os }}-ruby-gems-fpm-

      - name: Install Ruby and FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev gcc g++
          sudo gem install fpm

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      # Keep both packages local until both pass; a matrix would upload one
      # package while the other was still unverified.
      - name: Build Debian packages
        id: build-debs
        working-directory: CeraUI
        shell: bash
        run: |
          for arch in arm64 amd64; do
            BUILD_ARCH="$arch" ./scripts/build/build-debian-package.sh
            stage="$RUNNER_TEMP/ceraui-debian/$arch"
            mkdir -p "$stage"
            cp dist/debian/*.deb "$stage/"
          done
        env:
          BUILD_VERSION: ${{ needs.calculate-version.outputs.version }}

      - name: Verify both Debian package systemd floors
        id: verify-debs
        working-directory: CeraUI
        shell: bash
        run: |
          shopt -s nullglob
          for arch in arm64 amd64; do
            packages=("$RUNNER_TEMP/ceraui-debian/$arch/"*.deb)
            if (( ${#packages[@]} != 1 )); then
              echo "::error::Expected exactly one $arch Debian package"
              exit 1
            fi

            deb="${packages[0]}"
            if [[ "$(dpkg-deb --field "$deb" Architecture)" != "$arch" ]]; then
              echo "::error::$deb must be a $arch package"
              exit 1
            fi
            depends="$(dpkg-deb --field "$deb" Depends)"
            depends="${depends//$'\n'/ }"
            printf '%s Depends: %s\n' "$deb" "$depends"
            if ! grep -Eq '(^|,)[[:space:]]*systemd \(>= 257\)[[:space:]]*(,|$)' <<< "$depends"; then
              echo "::error::$deb must depend on systemd (>= 257)"
              exit 1
            fi
          done

      - name: Upload verified Debian packages
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ceraui-debian
          path: ${{ runner.temp }}/ceraui-debian/*/*.deb
          if-no-files-found: error

      - name: Save Bun install cache
        if: success() && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Save Ruby gems cache (fpm)
        if: success() && steps.fpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /var/lib/gems
          key: ${{ steps.fpm-cache.outputs.cache-primary-key }}

  publish-federation:
    name: Publish Federation Bundles to R2
    runs-on: ubuntu-latest
    needs: [calculate-version, release-package-contracts, build-debian-package]
    if: success()
    permissions:
      contents: read
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Verify federation version matches the release
        working-directory: CeraUI
        env:
          RELEASE_VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION" || {
            echo "::error::package.json version ${PACKAGE_VERSION} does not match release ${RELEASE_VERSION}"
            exit 1
          }

      # Vite lib-mode federation build (separate from the SPA/backend build, which
      # rm -rf's dist/). Run standalone so nothing wipes dist/federation/<version>.
      - name: Build federation bundles
        working-directory: CeraUI
        run: bun run build:federation

      - name: Test built federation assets
        working-directory: CeraUI
        run: bun test ./scripts/federation-assets.test.mjs

      - name: Enforce federation gzip budgets
        working-directory: CeraUI
        run: bun scripts/ci/bundle-report.mjs --federation-only

      # build+sign+verify gate: sign-federation.ts signs every bundle (GPG + SRI)
      # and the manifest (Ed25519), then self-verifies. It fail-closes when a
      # signing key is absent, so a missing secret blocks publish — by design.
      - name: Sign + verify federation bundles
        working-directory: CeraUI
        env:
          GPG_SIGNING_KEY: ${{ secrets.FEDERATION_GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_ID: ${{ secrets.FEDERATION_GPG_SIGNING_KEY_ID }}
          GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.FEDERATION_GPG_SIGNING_KEY_PASSPHRASE }}
          FEDERATION_MANIFEST_PRIVATE_KEY: ${{ secrets.FEDERATION_MANIFEST_PRIVATE_KEY }}
          FEDERATION_MANIFEST_PUBLIC_KEY: ${{ secrets.FEDERATION_MANIFEST_PUBLIC_KEY }}
        run: bun run sign:federation

      # Independent re-verification of the on-disk artifacts as the final gate
      # before any R2 write — a tampered or partial artifact never reaches R2.
      - name: Re-verify signed artifacts (gate before upload)
        working-directory: CeraUI
        env:
          GPG_SIGNING_KEY: ${{ secrets.FEDERATION_GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_ID: ${{ secrets.FEDERATION_GPG_SIGNING_KEY_ID }}
          GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.FEDERATION_GPG_SIGNING_KEY_PASSPHRASE }}
          FEDERATION_MANIFEST_PRIVATE_KEY: ${{ secrets.FEDERATION_MANIFEST_PRIVATE_KEY }}
          FEDERATION_MANIFEST_PUBLIC_KEY: ${{ secrets.FEDERATION_MANIFEST_PUBLIC_KEY }}
        run: bun run sign:federation -- --verify-only

      - name: Upload federation bundles to R2
        working-directory: CeraUI
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          VERSION="$(bun -p "require('./package.json').version")"
          FED_DIR="dist/federation/${VERSION}"
          DEST_PREFIX="ui-bundle/${VERSION}"

          test -d "$FED_DIR" || { echo "::error::no federation output at ${FED_DIR}"; exit 1; }
          test -f "${FED_DIR}/manifest.json" || { echo "::error::manifest.json missing — sign step did not run"; exit 1; }
          test -f "${FED_DIR}/manifest.json.sig" || { echo "::error::manifest.json.sig missing"; exit 1; }

          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          bash scripts/build/publish-federation-immutable.sh "$FED_DIR" "$DEST_PREFIX"

      - name: Federation Publish Summary
        if: success()
        working-directory: CeraUI
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "## 📦 Federation Bundles Published"
            echo ""
            echo "**CeraUI version:** \`${VERSION}\`"
            echo "**R2 prefix:** \`ui-bundle/${VERSION}/\`"
            echo "**Served at:** https://apt.ceralive.tv/ui-bundle/${VERSION}/"
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [calculate-version, build-ceraui-system, build-debian-package, publish-federation]
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Prepare release assets
        run: |
          test -s release-assets/release-body/release-body.md
          mkdir -p final-assets

          # Move all archives and packages to final-assets
          find release-assets -name "*.tar.gz" -exec mv {} final-assets/ \;
          find release-assets -name "*.deb" -exec cp {} final-assets/ \;

          # Generate checksums
          cd final-assets
          for f in *.tar.gz *.deb; do
            sha256sum "$f" > "$f.sha256"
          done

          echo "📦 Release assets:"
          ls -la

      - name: Ensure release target is still unused
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.calculate-version.outputs.tag }}
        run: |
          require_missing() {
            local endpoint="$1"
            local label="$2"
            local response
            local status

            set +e
            response="$(gh api --include "$endpoint" 2>&1)"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "::error::${label} ${TAG} appeared while release assets were building"
              exit 1
            fi
            if ! grep -Eq '^HTTP/[0-9.]+ 404 ' <<< "$response"; then
              echo "::error::failed to re-verify that ${label} ${TAG} is unused"
              printf '%s\n' "$response" >&2
              exit 1
            fi
          }

          require_missing "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" "git tag"
          require_missing "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" "GitHub release"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.calculate-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CeraUI ${{ needs.calculate-version.outputs.tag }}${{ needs.calculate-version.outputs.is_beta == 'true' && ' (Beta)' || '' }}
          body_path: release-assets/release-body/release-body.md
          files: final-assets/*
          draft: false
          prerelease: ${{ needs.calculate-version.outputs.is_beta == 'true' }}

      - name: Verify release tag provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.calculate-version.outputs.tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          ACTUAL_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT" || {
            echo "::error::release tag ${TAG} points to ${ACTUAL_COMMIT}, expected ${EXPECTED_COMMIT}"
            exit 1
          }

      - name: Release Summary
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
          TAG: ${{ needs.calculate-version.outputs.tag }}
          IS_BETA: ${{ needs.calculate-version.outputs.is_beta }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TYPE_LABEL=$([[ "$IS_BETA" == "true" ]] && echo "🧪 Beta (Pre-release)" || echo "✅ Stable")
          {
            echo "## 🎉 Release Created!"
            echo ""
            echo "**Version:** \`${VERSION}\`"
            echo "**Tag:** \`${TAG}\`"
            echo "**Type:** ${TYPE_LABEL}"
            echo ""
            echo "### Assets Uploaded:"
            echo ""
            for f in final-assets/*; do echo "- \`$(basename "$f")\`"; done
            echo ""
            echo "🔗 [View Release](https://github.com/${REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-apt-reindex:
    name: Dispatch stable APT reindex
    runs-on: ubuntu-latest
    needs: [calculate-version, create-release]
    if: success() && needs.calculate-version.outputs.is_beta != 'true'
    steps:
      - name: Trigger centralized APT reindex
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CERALIVE_DISPATCH_TOKEN }}
          repository: CERALIVE/apt-worker
          event-type: apt-reindex
          client-payload: >-
            {"component":"ceralive-device","repo":"CeraUI","channel":"stable","tag":"${{ needs.calculate-version.outputs.tag }}","version":"${{ needs.calculate-version.outputs.version }}"}
