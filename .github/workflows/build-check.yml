name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'probe/**']

env:
  NODE_VERSION: "26"
  # E2E fan-out. The union of project×shard lanes runs the same functional
  # spec×project set as the unsharded run (458 invocations on 2026-07-13);
  # a11y (desktop-only) runs once on desktop shard 1.
  TOTAL_SHARDS: "2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Change detection. Every code job below is gated on this job's `code` output so
  # a documentation-only PR pays for nothing. The scope lives HERE and not on the
  # `pull_request` trigger, because a trigger filter stops the workflow from
  # starting at all — and a required check that never reports blocks a merge
  # instead of passing it. The always-run `test` summary at the bottom is what
  # branch protection requires, so this workflow must always start, then decide.
  #
  # `predicate-quantifier: 'every'` is MANDATORY here and not a tuning knob. The
  # action's default is `some`, under which the leading `'**'` matches every
  # changed file on its own and the exclusions below can never take a file out of
  # `code` — the filter would report `true` for a README-only PR, forever.
  # `every` makes a file count as `code` only when it matches `'**'` AND every
  # negation. The quantifier is a property of the STEP, so an exclusion filter
  # like this one must never share a step with a positive OR list.
  #
  # There is deliberately no second `workflows` filter: a workflow file matches
  # `'**'` and no negation, so editing one already yields `code=true`.
  changes:
    name: Change detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # The job-level mapping is mandatory. Without it `needs.changes.outputs.code`
    # resolves to the empty string in every gated job and the whole gate silently
    # skips — a misleading green rather than a failure.
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!inspiration/**'

  # Deliberately has NO `Setup Node.js` step, unlike every other job here: every
  # command it runs is Bun (vitest via `bun --bun`, the rest `bun`/`bun test`), and
  # this tree has no install lifecycle script for `bun install` to shell out with.
  # Do not re-add setup-node without a command that actually needs Node.
  test-fe:
    name: FE unit shard ${{ matrix.shard }}/4
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # ~2x the expected worst shard (a quarter of the ~22 min single run): slack for
    # runner jitter, without letting a genuine hang burn the six-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      VITEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Unit tests (vitest shard)
        working-directory: CeraUI
        run: bun run --filter frontend test:ci-shard

      # `!cancelled()`, not `always()`: a FAILING shard still wrote its blob and the
      # merged report must carry its failures; a cancelled one has nothing to upload.
      # `.vitest/` is a dot-directory, so the hidden-files opt-in is what makes this
      # upload non-empty at all.
      - name: Upload vitest blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: CeraUI/apps/frontend/.vitest/blob
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  merge-fe-reports:
    name: Merge FE unit blob reports
    # `!cancelled()` stays: a FAILING shard's blob is exactly what the merged
    # report must carry, so this must not degrade to needs-success.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    needs: [changes, test-fe]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Download vitest blob reports
        uses: actions/download-artifact@v8
        with:
          path: CeraUI/apps/frontend/.vitest/blob
          pattern: vitest-blob-*
          merge-multiple: true

      - name: Merge vitest reports
        working-directory: CeraUI
        run: bun run --filter frontend test:ci-merge

  # The non-vitest gates that used to ride the single FE job. Seconds of work each,
  # so pinning them behind a 20-minute test lane only delayed their signal.
  guardrails:
    name: Tech-debt + spec guardrails + workflow shape
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Tech-debt register gate (validator unit tests + live register check)
        working-directory: CeraUI
        run: |
          bun run test:tech-debt
          bun run check:tech-debt

      - name: Guardrail — no page.screenshot/toHaveScreenshot in functional specs
        working-directory: CeraUI
        run: |
          ! grep -rE "page\.screenshot\(|toHaveScreenshot\(" apps/frontend/tests/e2e --include="*.spec.ts" | grep -v "\.visual\.spec\.ts"

      - name: Guardrail — no waitForTimeout in specs
        working-directory: CeraUI
        run: |
          ! grep -rE "waitForTimeout|page\.waitFor\(\s*[0-9]" apps/frontend/tests/e2e --include="*.spec.ts" | grep -v "\.visual\.spec\.ts"

      - name: Guardrail — no hardcoded #nav-tab- selectors in specs
        working-directory: CeraUI
        run: |
          ! grep -rnE "#nav-tab-" apps/frontend/tests/e2e --include="*.spec.ts"

      - name: Build Check workflow shape gate
        working-directory: CeraUI
        run: bun run test:build-check-shape

      # `test:ci-shard` runs vitest alone, so without this step the preflight the
      # frontend `test` script chains locally would vanish from CI entirely.
      - name: Input-picker hardware preflight
        working-directory: CeraUI
        run: bun run --filter frontend test:hardware-preflight

  test-be:
    name: BE unit (bun) + exec-guard + biome
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache Ruby gems (fpm)
        uses: actions/cache@v6
        with:
          path: /var/lib/gems
          key: ${{ runner.os }}-ruby-gems-fpm-v1
          restore-keys: |
            ${{ runner.os }}-ruby-gems-fpm-

      - name: Install Ruby and FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev gcc g++
          sudo gem install --no-document fpm

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Release/package contract gate
        working-directory: CeraUI
        run: bun run test:release-package-contracts

      - name: Biome check (lint + format gate — S4 reliability rules)
        working-directory: CeraUI
        run: bunx biome check .

      - name: Backend typecheck (socket contract)
        working-directory: CeraUI
        run: bun run --filter backend check

      - name: RC-pin merge gate (no -rc. pin of @ceralive/{control-protocol,cerastream})
        working-directory: CeraUI
        run: bun run check:rc-pins

      - name: Exec-guard gate (S1/S2 — bare-exec + spawn-policy contract + registration)
        working-directory: CeraUI
        run: bun run --filter backend check:exec-guard

      - name: Prepare backend test runtime directories
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /run/ceralive /var/run/bcrpt

      - name: Enable unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Mock device attach service contract
        working-directory: CeraUI
        run: bun run test:service-contract

      - name: Unit tests (bun)
        working-directory: CeraUI
        run: bun run --filter backend test

      # These two tests measure a REAL weighted packet distribution through a real
      # netns/nftables setup, so their statistical bounds only hold with CPU
      # headroom: inside the full backend suite the ratio was observed at 5.897
      # against a 5.5 ceiling, while isolated runs pass cleanly. They skip
      # themselves during the bundled run above and execute here instead, after
      # it, reusing this job's AppArmor unprivileged-userns sysctl.
      - name: netns-semantics (isolated — statistical assertions need CPU headroom)
        working-directory: CeraUI
        env:
          CERALIVE_NETNS_ISOLATED: "1"
        run: bun test apps/backend/src/tests/uplink-steering-netns.test.ts apps/backend/src/tests/uplink-shaper-netns.test.ts

      - name: i18n unit tests (bun — frozen rendered oracle + backend labelKey contract)
        working-directory: CeraUI
        run: bun run --filter @ceraui/i18n test

  setup-e2e:
    name: E2E setup (package deps, browser cache, frontend build)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Resolve Playwright browser version
        id: playwright-version
        working-directory: CeraUI
        run: |
          version="$(bunx --bun playwright --version | sed -n 's/^Version //p')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-v2-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-v2-

      # Deliberately UNCONDITIONAL: `actions/cache` never re-saves on an exact-key
      # hit, so a cache that is missing a browser can never repair itself and every
      # later run skips the install and fails at `browserType.launch`. `playwright
      # install` is idempotent and near-instant once the binaries are present.
      - name: Install Playwright browsers
        working-directory: CeraUI
        run: bun run --filter frontend test:e2e:install-browser

      - name: Prepare pinned srtla-send runtime
        working-directory: CeraUI
        run: |
          set -euo pipefail
          package_dir="dist/ci-packages"
          package_path="$package_dir/srtla-send-rs_3.2.0_amd64.deb"
          runtime_root="dist/ci-runtime"
          mkdir -p "$package_dir" "$runtime_root"

          curl --fail --location --silent --show-error \
            --output "$package_path" \
            https://github.com/CERALIVE/srtla-send-rs/releases/download/v3.2.0/srtla-send-rs_3.2.0_amd64.deb
          printf '%s  %s\n' \
            cfd2cc6a0bcb3716c25861daffca9b67e5a56b1c8cf9cb519093588496a928ae \
            "$package_path" | sha256sum --check
          test "$(dpkg-deb --field "$package_path" Package)" = srtla-send-rs
          test "$(dpkg-deb --field "$package_path" Version)" = 3.2.0
          test "$(dpkg-deb --field "$package_path" Architecture)" = amd64
          dpkg-deb --extract "$package_path" "$runtime_root"
          test -f "$runtime_root/usr/bin/srtla_send"

      - name: Frontend typecheck (svelte-check)
        working-directory: CeraUI
        run: bun run --filter frontend check

      - name: Build frontend once
        working-directory: CeraUI
        run: bun run build:frontend

      - name: Bundle size report (initial-route JS gzip budget)
        working-directory: CeraUI
        run: bun scripts/ci/bundle-report.mjs

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: CeraUI/dist/public/
          if-no-files-found: error
          retention-days: 1

      - name: Upload srtla-send runtime
        uses: actions/upload-artifact@v7
        with:
          name: srtla-send-runtime-amd64-v3.2.0
          path: CeraUI/dist/ci-runtime/
          if-no-files-found: error
          retention-days: 1

  test-e2e:
    name: E2E (${{ matrix.project }} shard ${{ matrix.shard }}/2)
    needs: [changes, setup-e2e]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        shard: [1, 2]
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Install Playwright system dependencies
        working-directory: CeraUI
        run: bun run --filter frontend test:e2e:install-deps

      - name: Resolve Playwright browser version
        id: playwright-version
        working-directory: CeraUI
        run: |
          version="$(bunx --bun playwright --version | sed -n 's/^Version //p')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-v2-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-v2-

      # Deliberately UNCONDITIONAL: `actions/cache` never re-saves on an exact-key
      # hit, so a cache that is missing a browser can never repair itself and every
      # later run skips the install and fails at `browserType.launch`. `playwright
      # install` is idempotent and near-instant once the binaries are present.
      - name: Install Playwright browsers
        working-directory: CeraUI
        run: bun run --filter frontend test:e2e:install-browser

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: CeraUI/dist/public

      - name: Download srtla-send runtime
        uses: actions/download-artifact@v8
        with:
          name: srtla-send-runtime-amd64-v3.2.0
          path: CeraUI/dist/ci-runtime

      - name: Activate srtla-send runtime
        working-directory: CeraUI
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/CeraUI/dist/ci-runtime/usr/bin"
          runtime_bin="$runtime_dir/srtla_send"
          chmod +x "$runtime_bin"
          echo "$runtime_dir" >> "$GITHUB_PATH"
          export PATH="$runtime_dir:$PATH"
          RUNTIME_DIR="$runtime_dir" bun -e '
            const path = "apps/backend/setup.json";
            const setup = await Bun.file(path).json();
            const runtime_dir = process.env.RUNTIME_DIR;
            if (!runtime_dir) throw new Error("RUNTIME_DIR is required");
            setup.srtla_path = runtime_dir;
            await Bun.write(path, JSON.stringify(setup, null, 2) + "\n");
          '
          test -x "$runtime_bin"
          test "$(command -v srtla_send)" = "$runtime_bin"

      - name: Seed E2E auth state
        working-directory: CeraUI
        run: E2E_PASSWORD=12345678 bun run scripts/ci/seed-e2e-auth.ts

      - name: Start E2E servers
        working-directory: CeraUI
        run: |
          set -euo pipefail
          mkdir -p apps/frontend/test-results

          VITE_DEVICE_HOST=127.0.0.1 VITE_DEVICE_PORT=3002 bun run --filter frontend preview -- --host 127.0.0.1 --port 6173 \
            > "apps/frontend/test-results/vite-preview-${{ matrix.project }}-${{ matrix.shard }}.log" 2>&1 &
          echo "$!" > apps/frontend/test-results/vite-preview.pid

          MOCK_SCENARIO=multi-modem-wifi NODE_ENV=development bun run --filter backend dev:e2e \
            > "apps/frontend/test-results/backend-${{ matrix.project }}-${{ matrix.shard }}.log" 2>&1 &
          echo "$!" > apps/frontend/test-results/backend.pid

          for url in http://127.0.0.1:6173 http://127.0.0.1:3002/api/health; do
            for attempt in {1..120}; do
              if curl -fsS "$url" >/dev/null; then
                echo "ready: $url"
                break
              fi
              if [[ "$attempt" -eq 120 ]]; then
                echo "::error::server did not become ready: $url"
                exit 1
              fi
              sleep 1
            done
          done

      # a11y is desktop-only and small (3 tests); run it once on shard 1 rather
      # than re-running it inside every shard.
      - name: Accessibility gate (axe-core — critical/serious, baselined)
        if: ${{ matrix.project == 'desktop' && matrix.shard == 1 }}
        working-directory: CeraUI
        run: CI=true E2E_PASSWORD=12345678 bun run --filter frontend test:e2e -- a11y.spec.ts --project=desktop --reporter=line,json,blob
        env:
          MOCK_SCENARIO: multi-modem-wifi
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/a11y-desktop-${{ matrix.shard }}.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: test-results/blob-report-a11y-desktop-${{ matrix.shard }}

      - name: Upload a11y blob report
        if: ${{ always() && matrix.project == 'desktop' && matrix.shard == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-a11y-desktop-${{ matrix.shard }}
          path: CeraUI/apps/frontend/test-results/blob-report-a11y-desktop-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 1

      # Functional run, sharded across the project×shard matrix. The project
      # filter narrows the suite first; sharding then splits within that project.
      # @premigration-upgrade is a run-once local migration gate whose input is a
      # gitignored pre-migration build, so it can never run in CI — it is excluded
      # here and in the root `test:e2e` script, the two places the tag list lives.
      - name: Functional E2E (screenshot-free, no @visual, a11y gated separately)
        working-directory: CeraUI
        run: CI=true E2E_PASSWORD=12345678 bun run --filter frontend test:e2e -- --grep-invert "@visual|@a11y|@gallery|@premigration-upgrade" --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ env.TOTAL_SHARDS }} --reporter=line,json,blob
        env:
          MOCK_SCENARIO: multi-modem-wifi
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-${{ matrix.project }}-${{ matrix.shard }}.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: test-results/blob-report-e2e-${{ matrix.project }}-${{ matrix.shard }}

      - name: Stop E2E servers
        if: always()
        working-directory: CeraUI
        run: |
          for pidfile in apps/frontend/test-results/backend.pid apps/frontend/test-results/vite-preview.pid; do
            if [[ -f "$pidfile" ]]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

      - name: Upload E2E timing artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timing-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            CeraUI/apps/frontend/test-results/*.json
            CeraUI/apps/frontend/test-results/*.log
            CeraUI/apps/frontend/test-results/blob-report-*/
          if-no-files-found: ignore

      - name: Upload E2E blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: CeraUI/apps/frontend/test-results/blob-report-e2e-${{ matrix.project }}-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 1

  merge-e2e-reports:
    name: Merge E2E blob reports
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    needs: [changes, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: CeraUI/apps/frontend/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge HTML report
        working-directory: CeraUI/apps/frontend
        run: bunx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-html-report
          path: CeraUI/apps/frontend/playwright-report/
          if-no-files-found: ignore

  # The one check branch protection requires. It runs on every event — including a
  # docs-only PR where every job above skipped — so the required check always
  # reports instead of leaving a merge waiting on a check that will never arrive.
  #
  # `needs` lists EVERY failure-bearing prerequisite, `setup-e2e` included. Omitting
  # it would make this job green when setup failed: the E2E lanes downstream skip
  # rather than fail, and a summary that only watches them sees nothing wrong.
  test:
    name: Test (unit + E2E guardrails)
    if: ${{ always() }}
    needs:
      - changes
      - test-fe
      - merge-fe-reports
      - guardrails
      - test-be
      - setup-e2e
      - test-e2e
      - merge-e2e-reports
      - build
    runs-on: ubuntu-latest
    steps:
      # On a code PR a SKIPPED job is an unexplained skip and is red — the gate
      # claimed the change was code, so nothing below it had licence to vanish.
      - name: Verify every gated job reported
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          RESULTS: >-
            changes=${{ needs.changes.result }}
            test-fe=${{ needs['test-fe'].result }}
            merge-fe-reports=${{ needs['merge-fe-reports'].result }}
            guardrails=${{ needs.guardrails.result }}
            test-be=${{ needs['test-be'].result }}
            setup-e2e=${{ needs['setup-e2e'].result }}
            test-e2e=${{ needs['test-e2e'].result }}
            merge-e2e-reports=${{ needs['merge-e2e-reports'].result }}
            build=${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "dependency results: ${RESULTS}"
          failed=""
          skipped=""
          for entry in ${RESULTS}; do
            case "${entry#*=}" in
              success) ;;
              skipped) skipped="${skipped} ${entry%%=*}" ;;
              *) failed="${failed} ${entry}" ;;
            esac
          done
          if [ -n "${failed}" ]; then
            echo "::error::Build Check job(s) did not succeed:${failed}"
            exit 1
          fi
          if [ "${CODE_CHANGED}" = "true" ]; then
            if [ -n "${skipped}" ]; then
              echo "::error::code changed but these jobs skipped:${skipped}"
              exit 1
            fi
            echo "every code job passed"
            exit 0
          fi
          echo "docs-only change; skipped as expected:${skipped:- none}"

  build:
    name: Build ${{ matrix.arch }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout CeraUI
        uses: actions/checkout@v7
        with:
          path: CeraUI

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('CeraUI/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        working-directory: CeraUI
        run: bun install --frozen-lockfile

      - name: Build backend for ${{ matrix.arch }}
        working-directory: CeraUI
        run: bun run build:backend
        env:
          BUILD_ARCH: ${{ matrix.arch }}

      - name: Build frontend
        working-directory: CeraUI
        run: bun run build:frontend

      - name: Guard — poisoned .env cannot leak into the production bundle
        working-directory: CeraUI
        run: |
          # A root .env is loaded by Vite in EVERY mode. Prove that even a
          # deliberately poisoned dev-only socket override cannot survive a
          # production build into dist/public (vite.config.ts outDir).
          echo "VITE_SOCKET_ENDPOINT=ws://localhost" > .env
          bun run build:frontend
          if grep -rq "ws://localhost" dist/public/; then
            echo "::error::poisoned .env leaked ws://localhost into the production bundle"
            grep -rl "ws://localhost" dist/public/ || true
            rm -f .env
            exit 1
          fi
          rm -f .env
          echo "OK: no ws://localhost in dist/public after a poisoned-.env prod build"

      - name: Verify build output
        working-directory: CeraUI
        run: |
          ls -la dist/
          test -f dist/ceralive || (echo "Backend binary not found" && exit 1)
          test -d dist/public || (echo "Frontend build not found" && exit 1)

      - name: Build Summary
        run: |
          {
            echo "## ✅ Build Check Passed"
            echo ""
            echo "**Architecture:** ${{ matrix.arch }}"
            echo ""
            echo "### Build Artifacts:"
            for f in CeraUI/dist/*; do echo "- \`$(basename "$f")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
